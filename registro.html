<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title> Registro</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
     <header>
    <h1><a href="./detalle.html">Volver al detalle del taller</a></h1>
  </header>
  <main>
    <form class="formulario-registro" id="form-registro" novalidate>
      <h1>Registrar Aisistencia</h1>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="boleta"
      >Número de boleta</label>
      <input type="text" id="boleta" name="boleta" required>
      
      <button type="submit">Registrar Asistencia</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>
    <p class="mensaje">Asistencia registrada correctamente</p>
  </main>
    
</body>
</html>
